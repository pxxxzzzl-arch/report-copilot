# 本地开发用的基础设施（与阶段 10 的生产部署文件 docker-compose.yml 分开）。
# 用到哪个服务才加哪个：阶段 4 只需要 Qdrant；Postgres / Redis 在阶段 7、8 加入。
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   docker compose -f deploy/docker-compose.dev.yml down        # 停止（数据保留在 deploy/volumes/）

services:
  qdrant:
    # 固定版本，与 qdrant-client 1.19.x 对应；升级时两边一起升
    image: qdrant/qdrant:v1.19.1
    container_name: report-copilot-qdrant
    ports:
      - "6333:6333"   # REST API（qdrant-client 默认使用）
      - "6334:6334"   # gRPC
    volumes:
      - ./volumes/qdrant:/qdrant/storage   # 持久化，容器重建后索引不丢
    restart: unless-stopped
